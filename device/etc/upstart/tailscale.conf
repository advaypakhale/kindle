# Tailscale in userspace mode; HTTP proxy on localhost:1056, SOCKS5 on :1055.
# The stock INPUT policy drops unsolicited UDP on wlan0, which forces DERP
# until a hole punch happens to win; a fixed port with an ACCEPT rule avoids it.
# Waits for /mnt/us, which is absent while the userstore is exported over USB.
start on started wifid
stop on stopping wifid

respawn
respawn limit 5 60

pre-start script
	iptables -C INPUT -i wlan0 -p udp --dport 41641 -j ACCEPT 2>/dev/null ||
		iptables -I INPUT -i wlan0 -p udp --dport 41641 -j ACCEPT
end script

exec sh -c 'while [ ! -x /mnt/us/tailscale/tailscaled ]; do sleep 5; done; exec /mnt/us/tailscale/tailscaled --tun=userspace-networking --port=41641 --statedir=/mnt/us/tailscale/state --socket=/var/run/tailscaled.sock --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1056 >/var/tmp/tailscaled.log 2>&1'
