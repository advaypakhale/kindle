# KOReader is the only UI; the stock framework jobs are removed.
# /mnt/us is absent while the userstore is exported over USB.
start on started volumd and started wifid
stop on stopping lab126

respawn
respawn limit 10 300

script
	while [ ! -x /mnt/us/koreader/koreader.sh ]; do sleep 2; done
	exec /mnt/us/koreader/koreader.sh --framework_stop
end script
