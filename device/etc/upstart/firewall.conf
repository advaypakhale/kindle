# SSH and calibre's wireless port stay off wlan0; tailscaled forwards
# tailnet SSH to the local dropbear, which does not traverse wlan0.
# Inserted at the head of INPUT so the ACCEPTs that usbnet and koreader.sh
# append later never match.
start on started wifid

task

script
	for r in "-p tcp --dport 22" "-p udp --dport 8134"; do
		iptables -C INPUT -i wlan0 $r -j DROP 2>/dev/null ||
			iptables -I INPUT 1 -i wlan0 $r -j DROP
	done
end script
